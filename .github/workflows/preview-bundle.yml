name: Preview bundle

on:
  pull_request:
  push:
    branches:
      - task-queue-concurrency-demo
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PREVIEW_IMAGE: ghcr.io/temporalio/priority-fairness-streamlit-demo-server-preview
  PREVIEW_TAG: 0d77be1f0

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned preview server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --file preview/server.Dockerfile \
            --tag "${PREVIEW_IMAGE}:${PREVIEW_TAG}" \
            .

      - name: Build demo application
        run: docker build --tag priority-fairness-concurrency-demo:local .

      - name: Start demo
        run: docker compose up --detach --no-build temporal bootstrap workers dashboard

      - name: Run end-to-end assertions
        run: docker compose --profile test run --rm e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color temporal workers dashboard

      - name: Publish preview server
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file preview/server.Dockerfile \
            --tag "${PREVIEW_IMAGE}:${PREVIEW_TAG}" \
            --tag "${PREVIEW_IMAGE}:preview" \
            --push \
            .

      - name: Stop demo
        if: always()
        run: docker compose down --remove-orphans
