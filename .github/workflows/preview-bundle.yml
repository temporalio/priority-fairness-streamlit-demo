name: Preview bundle

on:
  pull_request:
  push:
    branches:
      - task-queue-concurrency-demo
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PREVIEW_IMAGE: ghcr.io/temporalio/priority-fairness-streamlit-demo-server-preview
  PREVIEW_TAG: 0d77be1f0

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build pinned preview server
        run: docker build --file preview/server.Dockerfile --tag temporal-task-queue-concurrency-preview:${PREVIEW_TAG} .

      - name: Build demo application
        run: docker build --tag priority-fairness-concurrency-demo:local .

      - name: Start demo
        run: docker compose up --detach --no-build temporal bootstrap workers dashboard

      - name: Run end-to-end assertions
        run: docker compose --profile test run --rm e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color temporal workers dashboard

      - name: Publish preview server
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "temporal-task-queue-concurrency-preview:${PREVIEW_TAG}" "${PREVIEW_IMAGE}:${PREVIEW_TAG}"
          docker tag "temporal-task-queue-concurrency-preview:${PREVIEW_TAG}" "${PREVIEW_IMAGE}:preview"
          docker push "${PREVIEW_IMAGE}:${PREVIEW_TAG}"
          docker push "${PREVIEW_IMAGE}:preview"

      - name: Stop demo
        if: always()
        run: docker compose down --remove-orphans
